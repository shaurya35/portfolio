name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-be:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rust-be
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/rust-be
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build
      - run: cargo test

  # Migrations used to run at boot, so every cold start of the Vercel
  # container paid for them: an advisory lock, a read of _sqlx_migrations and
  # a checksum pass, all over a connection to a database in another region.
  # They belong on the deploy, not on the request path — this job runs them
  # on the same push that ships the code.
  #
  # Requires a DATABASE_URL repository secret. If it is missing this job goes
  # red, which is the point: a silent skip would leave the deployed binary
  # talking to an un-migrated database.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust-be
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rust-be
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/rust-be
      - run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked
      - run: cargo sqlx migrate run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run lint
      - run: bunx next typegen
      - run: bunx tsc --noEmit
