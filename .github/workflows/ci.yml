name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-be:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rust-be
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/rust-be
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run lint
      - run: bunx next typegen
      - run: bunx tsc --noEmit
