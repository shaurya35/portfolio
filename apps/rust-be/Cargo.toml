[package]
name = "rust-be"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
chrono = { version = "0.4.41", features = ["serde"] }
thiserror = "2.0.20"
dotenvy = "0.15.7"
tracing = "0.1.44"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "macros", "chrono"] }
pulldown-cmark = "0.13"
pulldown-cmark-escape = "0.11"
argon2 = "0.5.3"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"] }
time = "0.3.55"
cookie = { version = "0.18.2", features = ["key-expansion"] }
blake3 = "1.8.6"
rand = "0.10.2"
tower-http = { version = "0.6.11", features = ["cors"] }
syntect = "5.3.0"
serde_json = "1"

# Cold starts are billed as Active CPU on Vercel and this binary is loaded
# on nearly every one of them, so the size of the artifact is a running cost,
# not just a build detail. Stripping symbols is most of the win; thin LTO and
# a single codegen unit shrink it further and cost only build time.
# Deliberately not `panic = "abort"`: a panic in one handler should take down
# that task, not the instance.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

